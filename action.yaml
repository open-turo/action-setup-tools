name: "Setup Multiple Language Environments"
description:
  "Set up tools e.g Python, Node.js, Go, Java, and Terraform using standard
  setup actions"

inputs:
  python:
    description: "Python version (e.g. 3.11)"
    required: false
  node:
    description: "Node.js version (e.g. 18)"
    required: false
  npm:
    description: "NPM version (e.g. 11.7.0)"
    required: false
  pnpm:
    description: "PNPM version (e.g. 9.9.0)"
    required: false
  yarn:
    description: "Yarn version (e.g. 1.22.22)"
    required: false
  go:
    description: "Go version (e.g. 1.22)"
    required: false
  java:
    description:
      "Java version with distribution (e.g. 8.0.442-tem) which is the same as in
      .sdkmanrc"
    required: false
  terraform:
    description: "Terraform version (e.g. 1.6.6)"
    required: false
  working-directory:
    description:
      "Directory to look for version files in (e.g. .python-version, yarn.lock)"
    required: false
    default: "."

runs:
  using: composite
  steps:
    # Detect version for Python from input or common version files.
    # This step enables conditional execution of the setup action,
    # either when a version is explicitly provided or when a known version file exists.
    - id: detect-python
      shell: bash
      env:
        PYTHON_INPUT: ${{ inputs.python }}
        WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        if [ -n "$PYTHON_INPUT" ]; then
          echo "VERSION=$PYTHON_INPUT" >> $GITHUB_OUTPUT
        elif [ -f "$WORKING_DIR/.python-version" ]; then
          echo "VERSION=$(cat "$WORKING_DIR/.python-version")" >> $GITHUB_OUTPUT
        else
          echo "VERSION=" >> $GITHUB_OUTPUT
        fi

    - name: Setup Python
      if: steps.detect-python.outputs.VERSION != ''
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.detect-python.outputs.VERSION }}

    # Detect version for Node from input or common version files.
    # This step enables conditional execution of the setup action,
    # either when a version is explicitly provided or when a known version file exists.
    - id: detect-node
      shell: bash
      env:
        NODE_INPUT: ${{ inputs.node }}
        WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        if [ -n "$NODE_INPUT" ]; then
          echo "VERSION=$NODE_INPUT" >> $GITHUB_OUTPUT
        elif [ -f "$WORKING_DIR/.node-version" ]; then
          echo "VERSION=$(cat "$WORKING_DIR/.node-version")" >> $GITHUB_OUTPUT
        elif [ -f "$WORKING_DIR/.nvmrc" ]; then
          echo "VERSION=$(cat "$WORKING_DIR/.nvmrc")" >> $GITHUB_OUTPUT
        else
          echo "VERSION=" >> $GITHUB_OUTPUT
        fi

    - name: Setup Node.js
      if: steps.detect-node.outputs.VERSION != ''
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.detect-node.outputs.VERSION }}

    # Detect which package manager to use based on lock files or explicit inputs.
    # Priority order: inputs > package.json#packageManager > lock files > default yarn v1
    - id: detect-package-manager
      shell: bash
      env:
        NPM_INPUT: ${{ inputs.npm }}
        PNPM_INPUT: ${{ inputs.pnpm }}
        YARN_INPUT: ${{ inputs.yarn }}
        WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        PM=""
        VERSION=""

        # 1. Explicit inputs
        if [ -n "$NPM_INPUT" ]; then
          PM=npm; VERSION=$NPM_INPUT
        elif [ -n "$PNPM_INPUT" ]; then
          PM=pnpm; VERSION=$PNPM_INPUT
        elif [ -n "$YARN_INPUT" ]; then
          PM=yarn; VERSION=$YARN_INPUT
        fi

        # 2. package.json#packageManager field (e.g. "pnpm@9.9.0" or "pnpm@9.9.0+sha256.abc")
        if [ -z "$PM" ] && [ -f "$WORKING_DIR/package.json" ]; then
          FIELD=$(grep -o '"packageManager"[[:space:]]*:[[:space:]]*"[^"]*"' "$WORKING_DIR/package.json" \
            | grep -o '"[^"]*"$' | tr -d '"')
          if [ -n "$FIELD" ]; then
            DETECTED_PM=$(echo "$FIELD" | cut -d'@' -f1)
            case "$DETECTED_PM" in
              npm|pnpm|yarn)
                PM=$DETECTED_PM
                VERSION=$(echo "$FIELD" | cut -d'@' -f2- | cut -d'+' -f1)
                ;;
            esac
          fi
        fi

        # 3. Lock files
        if [ -z "$PM" ]; then
          if [ -f "$WORKING_DIR/package-lock.json" ]; then PM=npm
          elif [ -f "$WORKING_DIR/pnpm-lock.yaml" ]; then PM=pnpm
          elif [ -f "$WORKING_DIR/yarn.lock" ]; then PM=yarn
          else PM=yarn  # default
          fi
        fi

        echo "PACKAGE_MANAGER=$PM" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Package Manager
      shell: bash
      env:
        PACKAGE_MANAGER:
          ${{ steps.detect-package-manager.outputs.PACKAGE_MANAGER }}
        VERSION: ${{ steps.detect-package-manager.outputs.VERSION }}
      run: |
        npm install -g "${PACKAGE_MANAGER}${VERSION:+@${VERSION}}"

    # Detect version for Go from input or common version files.
    # This step enables conditional execution of the setup action,
    # either when a version is explicitly provided or when a known version file exists.
    - id: detect-go
      shell: bash
      env:
        GO_INPUT: ${{ inputs.go }}
        WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        if [ -n "$GO_INPUT" ]; then
          echo "VERSION=$GO_INPUT" >> $GITHUB_OUTPUT
        elif [ -f "$WORKING_DIR/.go-version" ]; then
          echo "VERSION=$(cat "$WORKING_DIR/.go-version")" >> $GITHUB_OUTPUT
        elif [ -f "$WORKING_DIR/go.mod" ]; then
          echo "VERSION_FILE=$WORKING_DIR/go.mod" >> $GITHUB_OUTPUT
        elif [ -f "$WORKING_DIR/go.work" ]; then
          echo "VERSION_FILE=$WORKING_DIR/go.work" >> $GITHUB_OUTPUT
        else
          echo "VERSION=" >> $GITHUB_OUTPUT
          echo "VERSION_FILE=" >> $GITHUB_OUTPUT
        fi

    - name: Setup Go (from input)
      if: steps.detect-go.outputs.VERSION != ''
      uses: actions/setup-go@v7
      with:
        go-version: ${{ steps.detect-go.outputs.VERSION }}
        cache: false

    # since go versions are defined in different formats, it's better to let setup-go to handle it
    - name: Setup Go (from version file)
      if:
        steps.detect-go.outputs.VERSION == '' &&
        steps.detect-go.outputs.VERSION_FILE != ''
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ steps.detect-go.outputs.VERSION_FILE }}
        cache: false

    # Detect version for Java from input or common version files.
    # This step enables conditional execution of the setup action,
    # either when a version is explicitly provided or when a known version file exists.
    - id: detect-java
      shell: bash
      env:
        JAVA_INPUT: ${{ inputs.java }}
        WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        if [ -n "$JAVA_INPUT" ]; then
          JAVA_VER="$JAVA_INPUT"
        elif [ -f "$WORKING_DIR/.sdkmanrc" ]; then
          JAVA_LINE=$(grep '^java=' "$WORKING_DIR/.sdkmanrc" | head -n1 | tr -d '[:space:]')
          if [[ "$JAVA_LINE" =~ ^java=.+$ ]]; then
            JAVA_VER="${JAVA_LINE#java=}"
          fi
        fi

        if [ -n "$JAVA_VER" ]; then
          # Extract base version (e.g., 17.0.2) and distribution suffix (e.g., tem)
          if [[ "$JAVA_VER" == *-* ]]; then
            JAVA_VERSION="${JAVA_VER%-*}"
            JAVA_DIST="${JAVA_VER##*-}"
          else
            JAVA_VERSION="$JAVA_VER"
            JAVA_DIST=""
          fi

          echo "VERSION=$JAVA_VERSION" >> $GITHUB_OUTPUT

          # Map known SDKMAN suffixes to setup-java distribution keywords
          case "$JAVA_DIST" in
            tem) JAVA_DISTRIBUTION="temurin" ;;
            zulu) JAVA_DISTRIBUTION="zulu" ;;
            adpt) JAVA_DISTRIBUTION="adopt" ;;
            openj9) JAVA_DISTRIBUTION="adopt-openj9" ;;
            librca) JAVA_DISTRIBUTION="liberica" ;;
            ms) JAVA_DISTRIBUTION="microsoft" ;;
            amzn) JAVA_DISTRIBUTION="corretto" ;;
            sem) JAVA_DISTRIBUTION="semeru" ;;
            oracle) JAVA_DISTRIBUTION="oracle" ;;
            dragonwell) JAVA_DISTRIBUTION="dragonwell" ;;
            sapmchn) JAVA_DISTRIBUTION="sapmachine" ;;
            graalce) JAVA_DISTRIBUTION="graalvm" ;;
            jbr) JAVA_DISTRIBUTION="jetbrains" ;;
            *) JAVA_DISTRIBUTION="$JAVA_DIST" ;; # Use as-is
          esac

          echo "DISTRIBUTION=$JAVA_DISTRIBUTION" >> $GITHUB_OUTPUT
        else
          echo "VERSION=" >> $GITHUB_OUTPUT
        fi

    - name: Setup Java
      id: setup-java
      if: steps.detect-java.outputs.VERSION != ''
      uses: actions/setup-java@v6
      with:
        distribution: ${{ steps.detect-java.outputs.DISTRIBUTION }}
        java-version: ${{ steps.detect-java.outputs.VERSION }}
        verify-signature: false

    - name: Export JAVA_HOME for subsequent steps
      shell: bash
      if: steps.detect-java.outputs.VERSION != ''
      env:
        JAVA_PATH: ${{ steps.setup-java.outputs.path }}
      run: echo "JAVA_HOME=$JAVA_PATH" >> $GITHUB_ENV

    # Detect version for Terraform from input or common version files.
    # This step enables conditional execution of the setup action,
    # either when a version is explicitly provided or when a known version file exists.
    - id: detect-terraform
      shell: bash
      env:
        TERRAFORM_INPUT: ${{ inputs.terraform }}
        WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        if [ -n "$TERRAFORM_INPUT" ]; then
          echo "VERSION=$TERRAFORM_INPUT" >> $GITHUB_OUTPUT
        elif [ -f "$WORKING_DIR/.terraform-version" ]; then
          echo "VERSION=$(cat "$WORKING_DIR/.terraform-version")" >> $GITHUB_OUTPUT
        else
          echo "VERSION=" >> $GITHUB_OUTPUT
        fi

    - name: Setup Terraform
      if: steps.detect-terraform.outputs.VERSION != ''
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ steps.detect-terraform.outputs.VERSION }}
#        terraform_wrapper: false
